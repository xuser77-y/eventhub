services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventhub
      POSTGRES_USER: eventhub
      POSTGRES_PASSWORD: eventhub_dev_password
    volumes:
      - eventhub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventhub -d eventhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://eventhub:eventhub_dev_password@db:5432/eventhub
      JWT_SECRET: change-this-before-production-use-32-characters-minimum
      JWT_EXPIRES_IN: 2h
      BCRYPT_ROUNDS: 12
      CORS_ORIGIN: http://localhost:5173
    command: sh -c "npm run migrate && npm start"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  eventhub_postgres_data:
